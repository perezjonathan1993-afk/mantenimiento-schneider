<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Mantenimiento Preventivo</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f0f2f5; color: #1a1a2e; }
.wrap { max-width: 480px; margin: 0 auto; padding: 12px; }
.header { background: linear-gradient(135deg, #1a5276, #2980b9); border-radius: 14px; padding: 16px; margin-bottom: 12px; color: white; }
.header h1 { font-size: 16px; font-weight: 600; }
.header p  { font-size: 12px; opacity: 0.85; margin-top: 4px; }
.header .periodo { background: rgba(255,255,255,0.2); display: inline-block; font-size: 11px; padding: 3px 10px; border-radius: 20px; margin-top: 6px; }
.card { background: white; border-radius: 14px; padding: 14px 16px; margin-bottom: 12px; box-shadow: 0 1px 4px rgba(0,0,0,0.07); }
.card-title { font-size: 11px; font-weight: 600; color: #7f8c8d; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 12px; }
select, input[type=text], textarea {
  width: 100%; padding: 10px 12px; border: 1.5px solid #e0e0e0;
  border-radius: 10px; font-size: 14px; background: #fafafa;
  color: #1a1a2e; outline: none; transition: border 0.2s;
}
select:focus, input:focus, textarea:focus { border-color: #2980b9; background: white; }
.equipo-info { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.badge { font-size: 11px; background: #eaf4fb; color: #1a5276; padding: 3px 10px; border-radius: 20px; }
.check-item { border-bottom: 1px solid #f0f0f0; padding: 10px 0; }
.check-item:last-child { border-bottom: none; }
.check-label { font-size: 13px; color: #2c3e50; margin-bottom: 6px; line-height: 1.4; }
.check-freq  { font-size: 10px; color: #aaa; }
.radio-row   { display: flex; gap: 6px; flex-wrap: wrap; }
.radio-row label {
  flex: 1; min-width: 60px; text-align: center;
  padding: 6px 4px; border: 1.5px solid #e0e0e0;
  border-radius: 8px; font-size: 11px; cursor: pointer;
  transition: all 0.15s; color: #555;
}
.radio-row input[type=radio] { display: none; }
.radio-row input:checked + label { background: #1a5276; color: white; border-color: #1a5276; font-weight: 600; }
canvas { border: 1.5px solid #e0e0e0; border-radius: 10px; background: #fafafa; display: block; touch-action: none; cursor: crosshair; width: 100%; }
.btn-clear  { font-size: 12px; color: #e74c3c; background: none; border: none; cursor: pointer; margin-top: 6px; padding: 0; }
.btn-submit {
  width: 100%; padding: 14px; background: linear-gradient(135deg, #1a5276, #2980b9);
  color: white; border: none; border-radius: 12px; font-size: 16px;
  font-weight: 600; cursor: pointer; margin-top: 4px; letter-spacing: 0.02em;
}
.btn-submit:active { opacity: 0.85; transform: scale(0.99); }
.btn-submit:disabled { background: #bdc3c7; cursor: not-allowed; }
.loading { text-align: center; padding: 8px; font-size: 13px; color: #2980b9; display: none; }
.success { text-align: center; padding: 40px 20px; display: none; }
.success .icon { font-size: 56px; }
.success h2  { font-size: 20px; font-weight: 600; margin-top: 12px; color: #1a5276; }
.success p   { font-size: 13px; color: #7f8c8d; margin-top: 6px; }
.btn-nuevo   { margin-top: 20px; padding: 12px 28px; border-radius: 10px; border: 1.5px solid #2980b9; background: none; font-size: 14px; cursor: pointer; color: #2980b9; font-weight: 500; }
.error-msg   { background: #fdecea; color: #c0392b; font-size: 12px; padding: 8px 12px; border-radius: 8px; margin-top: 8px; display: none; }
</style>
</head>
<body>
<div class="wrap">
<div id="form-view">

  <div class="header">
    <h1>🔧 Mantenimiento Preventivo</h1>
    <p>Schneider Electric — completá la inspección</p>
    <span class="periodo" id="periodo-label"></span>
  </div>

  <!-- EQUIPO -->
  <div class="card">
    <div class="card-title">Equipo a inspeccionar</div>
    <select id="equipo-sel"></select>
    <div class="equipo-info" id="equipo-info"></div>
  </div>

  <!-- CHECKLIST -->
  <div class="card" id="checklist-card">
    <div class="card-title">Checklist de inspección</div>
    <div id="items-container"></div>
  </div>

  <!-- OBSERVACIONES -->
  <div class="card">
    <div class="card-title">Observaciones generales</div>
    <textarea id="observaciones" rows="3" placeholder="Ingresá observaciones si corresponde..."></textarea>
  </div>

  <!-- TÉCNICO Y FIRMA -->
  <div class="card">
    <div class="card-title">Técnico responsable</div>
    <input type="text" id="tecnico" placeholder="Nombre completo del técnico" autocomplete="name" style="margin-bottom:12px;" />
    <div style="font-size:12px;color:#7f8c8d;margin-bottom:6px;">Firma digital</div>
    <canvas id="firma" height="120"></canvas>
    <button class="btn-clear" onclick="clearFirma()">✕ Borrar firma</button>
  </div>

  <div class="error-msg" id="error-msg"></div>
  <div class="loading" id="loading">⏳ Guardando inspección...</div>

  <div style="padding-bottom:16px;margin-top:4px;">
    <button class="btn-submit" id="btn-enviar" onclick="enviar()">Guardar inspección ✓</button>
  </div>

</div>

<div id="success-view" class="success">
  <div class="icon">✅</div>
  <h2>Inspección guardada</h2>
  <p id="success-detail"></p>
  <p style="font-size:11px;color:#aaa;margin-top:6px;">Registrado en SharePoint correctamente.</p>
  <button class="btn-nuevo" onclick="resetForm()">+ Nueva inspección</button>
</div>
</div>

<script>
// ─── CONFIGURACIÓN GOOGLE SHEETS ────────────────────────────────────────────
const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwBCxBCRdRj9sPjr-eE0mOIQgbLbB6Zg16Xerto0xrWbWOtbIP66LDQRPeGIYGWdZEa/exec";

// ─── DATOS ──────────────────────────────────────────────────────────────────
const EQUIPOS = [
  {n:1,  tipo:"AA",   marca:"Schneider BGH", modelo:"Split",            cap:"Frio 3450/Calor 3550",   ubi:"Puesto Base"},
  {n:2,  tipo:"AA",   marca:"Carrier",       modelo:"Split",            cap:"Frio 5050/Calor 5300",   ubi:"Oficina ETO"},
  {n:3,  tipo:"AA",   marca:"Carrier",       modelo:"Split",            cap:"Frio 5050/Calor 5300",   ubi:"Oficina ETO"},
  {n:4,  tipo:"AA",   marca:"Carrier",       modelo:"Split",            cap:"Frio 5050/Calor 5300",   ubi:"Oficina ETO"},
  {n:5,  tipo:"AA",   marca:"Carrier",       modelo:"Split",            cap:"Frio 5050/Calor 5300",   ubi:"Oficina ETO"},
  {n:6,  tipo:"AA",   marca:"BGH",           modelo:"Split",            cap:"Frio 6300/Calor 6400",   ubi:"Micom"},
  {n:7,  tipo:"AA",   marca:"BGH",           modelo:"Split",            cap:"Frio 6300/Calor 6400",   ubi:"Laboratorio Sol"},
  {n:8,  tipo:"AA",   marca:"BGH",           modelo:"Split",            cap:"Frio 6300/Calor 6400",   ubi:"Laboratorio Sol"},
  {n:9,  tipo:"AA",   marca:"BGH",           modelo:"Split",            cap:"Frio 6300/Calor 6400",   ubi:"Steiging"},
  {n:10, tipo:"AA",   marca:"York",          modelo:"Cassette Inverter",cap:"Frio 12868/Calor 16120", ubi:"Steiging"},
  {n:11, tipo:"AA",   marca:"York",          modelo:"Cassette Inverter",cap:"Frio 12868/Calor 16120", ubi:"Steiging"},
  {n:12, tipo:"AA",   marca:"York",          modelo:"Cassette Inverter",cap:"Frio 12868/Calor 16120", ubi:"Steiging"},
  {n:13, tipo:"AA",   marca:"York",          modelo:"Split Inverter",   cap:"Frio 3450/Calor 3520",   ubi:"Sala Electrica"},
  {n:14, tipo:"AA",   marca:"BGH",           modelo:"Split",            cap:"Frio 3450/Calor 3500",   ubi:"Sala de Juegos"},
  {n:15, tipo:"AA",   marca:"BGH",           modelo:"Split",            cap:"Frio 3450/Calor 3500",   ubi:"Sala de Juegos"},
  {n:16, tipo:"AA",   marca:"BGH",           modelo:"Split",            cap:"Frio 3450/Calor 3500",   ubi:"Sala de Juegos"},
  {n:17, tipo:"AA",   marca:"BGH",           modelo:"Split",            cap:"Frio 3450/Calor 3550",   ubi:"Sala de Enfermeria"},
  {n:18, tipo:"AA",   marca:"BGH",           modelo:"Split",            cap:"Frio 6300/Calor 6400",   ubi:"Comedor"},
  {n:19, tipo:"AA",   marca:"BGH",           modelo:"Split",            cap:"Frio 6300/Calor 6400",   ubi:"Comedor"},
  {n:20, tipo:"AA",   marca:"BGH",           modelo:"Split",            cap:"Frio 6300/Calor 6400",   ubi:"Comedor"},
  {n:21, tipo:"AA",   marca:"BGH",           modelo:"Split",            cap:"Frio 3450/Calor 3550",   ubi:"Recepcion"},
  {n:22, tipo:"AA",   marca:"BGH",           modelo:"Split",            cap:"Frio 3450/Calor 3550",   ubi:"Recepcion"},
  {n:23, tipo:"AA",   marca:"BGH",           modelo:"Split",            cap:"Frio 3450/Calor 3520",   ubi:"Sala Sistemas"},
  {n:24, tipo:"AA",   marca:"York",          modelo:"Split",            cap:"Frio 3450/Calor 3520",   ubi:"Sala Sistemas"},
  {n:25, tipo:"AA",   marca:"BGH",           modelo:"Split",            cap:"Frio 3450/Calor 3550",   ubi:"Sala de Reunion CD"},
  {n:26, tipo:"AA",   marca:"BGH",           modelo:"Split",            cap:"Frio 6300/Calor 6400",   ubi:"Oficina CD"},
  {n:27, tipo:"AA",   marca:"BGH",           modelo:"Split",            cap:"Frio 6500/Calor 6400",   ubi:"Laboratorio HP"},
  {n:28, tipo:"AA",   marca:"Surrey",        modelo:"Split",            cap:"Frio 5350/Calor 5550",   ubi:"Vestuario Mujeres"},
  {n:1,  tipo:"DOCK", marca:"Hidraulico",    modelo:"Dock de Carga",    cap:"N/A",                    ubi:"Dock N1"},
  {n:2,  tipo:"DOCK", marca:"Hidraulico",    modelo:"Dock de Carga",    cap:"N/A",                    ubi:"Dock N2"},
  {n:3,  tipo:"DOCK", marca:"Hidraulico",    modelo:"Dock de Carga",    cap:"N/A",                    ubi:"Dock N3"},
  {n:4,  tipo:"DOCK", marca:"Hidraulico",    modelo:"Dock de Carga",    cap:"N/A",                    ubi:"Dock N4"},
  {n:5,  tipo:"DOCK", marca:"Hidraulico",    modelo:"Dock de Carga",    cap:"N/A",                    ubi:"Dock N5"},
  {n:6,  tipo:"DOCK", marca:"Hidraulico",    modelo:"Dock de Carga",    cap:"N/A",                    ubi:"Dock N6"},
  {n:7,  tipo:"DOCK", marca:"Hidraulico",    modelo:"Dock de Carga",    cap:"N/A",                    ubi:"Dock N7"},
  {n:8,  tipo:"DOCK", marca:"Hidraulico",    modelo:"Dock de Carga",    cap:"N/A",                    ubi:"Dock N8"},
  {n:9,  tipo:"DOCK", marca:"Hidraulico",    modelo:"Dock de Carga",    cap:"N/A",                    ubi:"Dock N9"},
  {n:10, tipo:"DOCK", marca:"Hidraulico",    modelo:"Dock de Carga",    cap:"N/A",                    ubi:"Dock N10"},
  {n:11, tipo:"DOCK", marca:"Hidraulico",    modelo:"Dock de Carga",    cap:"N/A",                    ubi:"Dock N11"},
  {n:12, tipo:"DOCK", marca:"Hidraulico",    modelo:"Dock de Carga",    cap:"N/A",                    ubi:"Dock N12"},
  {n:13, tipo:"DOCK", marca:"Hidraulico",    modelo:"Dock de Carga",    cap:"N/A",                    ubi:"Dock N13"},
];

const ITEMS_AA = [
  {key:"item1_termostatos",        desc:"Control de termostatos y enclavamientos",        freq:"Mensual"},
  {key:"item2_inspeccion_general", desc:"Inspeccion general del equipo",                  freq:"Mensual"},
  {key:"item3_difusores",          desc:"Control / limpieza de difusores de aire",        freq:"Mensual"},
  {key:"item4_filtros",            desc:"Inspeccion / limpieza / cambio de filtros",      freq:"Mensual"},
  {key:"item5_rodamientos",        desc:"Verificar rodamientos / turbina / motor",        freq:"Trimestral"},
  {key:"item6_unidad_interior",    desc:"Limpieza de unidad interior",                    freq:"Mensual"},
  {key:"item7_gabinete_exterior",  desc:"Limpieza de gabinete exterior (hidrolavado)",    freq:"Anual"},
];

const ITEMS_DOCK = [
  {key:"item1_termostatos",        desc:"Estado general del dock",                        freq:"Mensual"},
  {key:"item2_inspeccion_general", desc:"Verificar funcionamiento de bomba hidraulica",   freq:"Mensual"},
  {key:"item3_difusores",          desc:"Verificar vibracion y perdidas de aceite",       freq:"Mensual"},
  {key:"item4_filtros",            desc:"Control de lubricacion de eje horizontal",       freq:"Mensual"},
  {key:"item5_rodamientos",        desc:"Estado gral: pintura, topes, etc",               freq:"Mensual"},
  {key:"item6_unidad_interior",    desc:"",                                                freq:""},
  {key:"item7_gabinete_exterior",  desc:"",                                                freq:""},
];

const OPTS = ["SI","NO","NO APLICA","CORRECTIVO"];

// ─── INIT ────────────────────────────────────────────────────────────────────
const MESES = ["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
function getPeriodo(){ const d=new Date(); return MESES[d.getMonth()]+" "+d.getFullYear(); }
document.getElementById("periodo-label").textContent = "📅 "+getPeriodo();

const sel = document.getElementById("equipo-sel");
EQUIPOS.forEach((e,i)=>{
  const o=document.createElement("option");
  o.value=i;
  o.textContent = e.tipo==="AA" ? `AA — Equipo N°${e.n} | ${e.ubi}` : `DOCK — N°${e.n} | ${e.ubi}`;
  sel.appendChild(o);
});

function updateEquipo(){
  const e=EQUIPOS[parseInt(sel.value)];
  document.getElementById("equipo-info").innerHTML=
    `<span class="badge">📍 ${e.ubi}</span><span class="badge">${e.marca}</span><span class="badge">${e.modelo}</span><span class="badge">${e.cap}</span>`;
  renderItems(e.tipo);
}
sel.addEventListener("change", updateEquipo);

function renderItems(tipo){
  const items = tipo==="AA" ? ITEMS_AA : ITEMS_DOCK;
  const cont = document.getElementById("items-container");
  cont.innerHTML="";
  items.forEach((it,i)=>{
    if(!it.desc) return;
    const div=document.createElement("div");
    div.className="check-item";
    const radios=OPTS.map(o=>`<input type="radio" name="item${i}" id="i${i}_${o}" value="${o}"><label for="i${i}_${o}">${o}</label>`).join("");
    div.innerHTML=`<div class="check-label">${it.desc} <span class="check-freq">${it.freq}</span></div><div class="radio-row">${radios}</div>`;
    cont.appendChild(div);
  });
}
updateEquipo();

// ─── FIRMA ───────────────────────────────────────────────────────────────────
const canvas=document.getElementById("firma");
const ctx=canvas.getContext("2d");
canvas.width=canvas.offsetWidth||340;
ctx.strokeStyle="#1a1a2e"; ctx.lineWidth=2.5; ctx.lineCap="round";
let drawing=false, lx=0, ly=0;
function pos(e,c){ const r=c.getBoundingClientRect(); if(e.touches) return{x:e.touches[0].clientX-r.left,y:e.touches[0].clientY-r.top}; return{x:e.clientX-r.left,y:e.clientY-r.top}; }
canvas.addEventListener("mousedown",e=>{drawing=true;const p=pos(e,canvas);lx=p.x;ly=p.y;});
canvas.addEventListener("mousemove",e=>{if(!drawing)return;const p=pos(e,canvas);ctx.beginPath();ctx.moveTo(lx,ly);ctx.lineTo(p.x,p.y);ctx.stroke();lx=p.x;ly=p.y;});
canvas.addEventListener("mouseup",()=>drawing=false);
canvas.addEventListener("touchstart",e=>{e.preventDefault();drawing=true;const p=pos(e,canvas);lx=p.x;ly=p.y;},{passive:false});
canvas.addEventListener("touchmove",e=>{e.preventDefault();if(!drawing)return;const p=pos(e,canvas);ctx.beginPath();ctx.moveTo(lx,ly);ctx.lineTo(p.x,p.y);ctx.stroke();lx=p.x;ly=p.y;},{passive:false});
canvas.addEventListener("touchend",()=>drawing=false);
function clearFirma(){ctx.clearRect(0,0,canvas.width,canvas.height);}
function firmaVacia(){return !ctx.getImageData(0,0,canvas.width,canvas.height).data.some(v=>v!==0);}

// ─── VALIDAR Y ENVIAR ────────────────────────────────────────────────────────
function showError(msg){ const el=document.getElementById("error-msg"); el.textContent=msg; el.style.display="block"; setTimeout(()=>el.style.display="none",4000); }

async function enviar(){
  const tecnico=document.getElementById("tecnico").value.trim();
  if(!tecnico){ showError("Por favor ingresá el nombre del técnico."); return; }
  if(firmaVacia()){ showError("Por favor agregá la firma digital."); return; }

  const eIdx=parseInt(sel.value);
  const e=EQUIPOS[eIdx];
  const items=e.tipo==="AA"?ITEMS_AA:ITEMS_DOCK;
  let allOk=true;
  const itemVals={};
  items.forEach((it,i)=>{
    if(!it.desc) return;
    const r=document.querySelector(`input[name="item${i}"]:checked`);
    if(!r) allOk=false;
    else itemVals[it.key]=r.value;
  });
  if(!allOk){ showError("Por favor completá todos los ítems del checklist."); return; }

  const btn=document.getElementById("btn-enviar");
  const loading=document.getElementById("loading");
  btn.disabled=true; loading.style.display="block";

  const now=new Date();
  const titulo=e.tipo==="AA"?`Equipo AA N${e.n} - ${e.ubi}`:`Dock N${e.n}`;

  const payload={
    Title: titulo,
    numero: e.n,
    tipo_equipo: e.tipo,
    marca: e.marca,
    modelo: e.modelo,
    capacidad: e.cap,
    ubicacion: e.ubi,
    tecnico: tecnico,
    periodo: getPeriodo(),
    fecha_inspeccion: now.toISOString(),
    observaciones: document.getElementById("observaciones").value,
    item1_termostatos:        itemVals.item1_termostatos||"",
    item2_inspeccion_general: itemVals.item2_inspeccion_general||"",
    item3_difusores:          itemVals.item3_difusores||"",
    item4_filtros:            itemVals.item4_filtros||"",
    item5_rodamientos:        itemVals.item5_rodamientos||"",
    item6_unidad_interior:    itemVals.item6_unidad_interior||"",
    item7_gabinete_exterior:  itemVals.item7_gabinete_exterior||"",
    vence_en_10_dias: "NO",
    estado: "VIGENTE",
    firma_base64: canvas.toDataURL("image/png"),
  };

  try {
    const resp = await fetch(GOOGLE_SCRIPT_URL, {
      method: "POST",
      mode: "no-cors",
      headers: {"Content-Type": "text/plain"},
      body: JSON.stringify(payload)
    });

    // no-cors no devuelve respuesta legible, asumimos éxito
    document.getElementById("form-view").style.display="none";
    document.getElementById("success-view").style.display="block";
    document.getElementById("success-detail").textContent=`${titulo} | Técnico: ${tecnico} | ${getPeriodo()}`;

  } catch(err){
    showError("Error de conexión: "+err.message);
    btn.disabled=false;
  }
  loading.style.display="none";
}

function resetForm(){
  document.getElementById("form-view").style.display="block";
  document.getElementById("success-view").style.display="none";
  document.getElementById("tecnico").value="";
  document.getElementById("observaciones").value="";
  clearFirma();
  document.querySelectorAll("input[type=radio]").forEach(r=>r.checked=false);
  sel.value="0"; updateEquipo();
  document.getElementById("btn-enviar").disabled=false;
}
</script>
</body>
</html>
