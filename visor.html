<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registro de Inspecciones — JLL</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@400;600;700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#131E29; --navy-2:#233244; --green:#3DCD58; --green-dark:#279A3D;
  --red:#E30613; --amber:#E3A63D; --grey:#8C97A3;
  --paper:#FFFFFF; --ground:#EEF1F4; --line:#D9DEE5; --ink:#1B2430; --muted:#5B6472;
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:"Source Sans 3",Calibri,Arial,sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,h3,.cond{font-family:"Roboto Condensed","Arial Narrow",Arial,sans-serif}
.wrap{max-width:980px;margin:0 auto;padding:16px}

/* ---------- barra superior ---------- */
.top{background:var(--navy);color:#fff;border-bottom:4px solid var(--green)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:14px;padding-bottom:14px}
.top h1{margin:0;font-size:18px;letter-spacing:.05em;text-transform:uppercase;display:flex;align-items:center;gap:10px}
.top h1 .mark{width:9px;height:22px;background:var(--green);border-radius:2px}
.top .jll{font-family:"Roboto Condensed",Arial,sans-serif;font-weight:700;background:var(--green);color:#0B2110;padding:4px 10px;border-radius:3px;font-size:13px}

/* ---------- filtros ---------- */
.filters{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:12px;margin:16px 0;display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.filters label{display:block;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.filters select,.filters input{width:100%;font:inherit;font-size:14px;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--ink)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.count{font-size:13px;color:var(--muted)}
.btn{appearance:none;border:1px solid var(--line);background:var(--paper);color:var(--ink);font:inherit;font-size:14px;font-weight:600;padding:9px 14px;border-radius:6px;cursor:pointer}
.btn.primary{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.accent{background:var(--green);border-color:var(--green);color:#0B2110}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* ---------- lista ---------- */
.list{display:grid;gap:8px}
.item{background:var(--paper);border:1px solid var(--line);border-left:5px solid var(--green);border-radius:8px;padding:12px 14px;display:grid;grid-template-columns:1fr auto;gap:4px 12px;cursor:pointer;text-align:left;font:inherit;color:inherit;width:100%}
.item:hover{border-color:var(--navy-2)}
.item.warn{border-left-color:var(--amber)}
.item .t,.item .s{grid-column:1}
.item .t{font-family:"Roboto Condensed",Arial,sans-serif;font-weight:700;font-size:16px;color:var(--navy)}
.item .s{font-size:13px;color:var(--muted)}
.item .st{grid-column:2;grid-row:1 / span 2;align-self:center;font-family:"Roboto Condensed",Arial,sans-serif;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding:4px 10px;border-radius:999px;background:rgba(61,205,88,.15);color:var(--green-dark);white-space:nowrap}
.item.warn .st{background:rgba(227,166,61,.18);color:#9A6A12}
.empty,.msg{background:var(--paper);border:1px dashed var(--line);border-radius:10px;padding:28px;text-align:center;color:var(--muted)}
.msg.err{border-color:var(--red);color:var(--red)}

/* ---------- clave ---------- */
.gate{max-width:380px;margin:60px auto;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:24px}
.gate h2{margin:0 0 6px;color:var(--navy)}
.gate p{margin:0 0 14px;color:var(--muted);font-size:14px}
.gate input{width:100%;font:inherit;font-size:16px;padding:10px 12px;border:1px solid var(--line);border-radius:6px;margin-bottom:10px}

/* ---------- planilla (mismo formato que la Planilla de Inspección JLL) ---------- */
.overlay{position:fixed;inset:0;background:rgba(19,30,41,.6);overflow-y:auto;padding:20px 12px;z-index:20}
.overlay[hidden]{display:none}
.ovbar{max-width:860px;margin:0 auto 10px;display:flex;justify-content:space-between;gap:8px}
.sheet{max-width:860px;margin:0 auto 24px;background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden;box-shadow:0 8px 24px rgba(19,30,41,.15)}
.lh{background:var(--navy);color:#fff;padding:14px 26px;display:flex;align-items:center;justify-content:space-between;border-bottom:4px solid var(--green)}
.lh .brand{font-family:"Roboto Condensed",Arial,sans-serif;font-weight:700;font-size:15px;letter-spacing:.06em;text-transform:uppercase;display:flex;align-items:center;gap:10px}
.lh .brand .mark{width:10px;height:22px;background:var(--green);border-radius:2px}
.lh .jll{font-family:"Roboto Condensed",Arial,sans-serif;font-weight:700;background:var(--green);color:#0B2110;padding:4px 10px;border-radius:3px;font-size:14px}
.tb{padding:20px 26px 12px;border-bottom:1px solid var(--line)}
.tb .eb{font-family:"Roboto Condensed",Arial,sans-serif;font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.tb h2{margin:0;font-size:26px;color:var(--navy);text-transform:uppercase;border-bottom:2px solid var(--line);padding-bottom:10px}
.meta{padding:16px 26px 20px;display:grid;grid-template-columns:1fr 1fr;gap:8px 34px;border-bottom:1px solid var(--line)}
.meta .r{display:flex;gap:10px;border-bottom:1px dotted var(--line);padding-bottom:4px;font-size:14px}
.meta .r b{flex:0 0 150px;font-size:12px;letter-spacing:.03em;text-transform:uppercase;color:var(--muted)}
.tw{padding:18px 26px 8px}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);margin-bottom:10px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:9px;height:9px;border-radius:2px;display:inline-block}
.tflex{display:flex;border:1px solid var(--navy);border-radius:6px;overflow:hidden}
.spine{flex:0 0 30px;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;padding:10px 0}
.spine span{writing-mode:vertical-rl;transform:rotate(180deg);font-family:"Roboto Condensed",Arial,sans-serif;font-weight:700;font-size:12.5px;letter-spacing:.06em;text-transform:uppercase}
.tcol{flex:1;min-width:0}
.th,.tr{display:grid;grid-template-columns:1fr 44px 44px 44px 72px}
.th{background:var(--ground);border-bottom:1px solid var(--line);font-family:"Roboto Condensed",Arial,sans-serif;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.th>div{padding:8px;display:flex;align-items:center;justify-content:center;text-align:center}
.th>div:first-child{justify-content:flex-start}
.tr{border-bottom:1px solid var(--line)}
.tr:last-child{border-bottom:none}
.tr>div{padding:8px;display:flex;align-items:center;justify-content:center;font-size:13.5px}
.tr>div:first-child{justify-content:flex-start;flex-direction:column;align-items:flex-start}
.tr .fq{font-size:10.5px;color:var(--grey)}
.sq{width:20px;height:20px;border:1.5px solid var(--line);border-radius:4px}
.sq.on{border-color:transparent}
.sq.si{background:var(--green)} .sq.no{background:var(--red)} .sq.na{background:var(--grey)} .sq.co{background:var(--amber)}
.obs{padding:6px 26px 22px}
.obs h3{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:14px 0 8px}
.obs .box{border:1px solid var(--line);border-radius:6px;padding:10px 12px;min-height:56px;font-size:13.5px;white-space:pre-wrap}
.sign{padding:20px 26px 24px;display:grid;grid-template-columns:1fr 1fr;gap:22px;border-top:1px solid var(--line)}
.sign .f{display:flex;flex-direction:column;gap:6px}
.sign label{font-size:11.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.sign .v{font-size:14px;border-bottom:1px dotted var(--line);padding:4px 2px}
.sigbox{border:1px solid var(--line);border-radius:8px;height:136px;display:flex;align-items:center;justify-content:center;padding:8px;background:#fff}
.sigbox img{max-width:100%;max-height:120px;object-fit:contain}
.sigbox .typed{font-family:"Segoe Script","Brush Script MT",cursive;font-style:italic;font-weight:700;font-size:26px;color:var(--navy);transform:rotate(-2deg)}
.stamp{display:flex;align-items:center;gap:8px;font-family:"Roboto Condensed",Arial,sans-serif;font-weight:700;font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--green-dark);margin-top:8px}
.stamp .dot{width:8px;height:8px;border-radius:50%;background:var(--green)}
.foot{background:var(--navy);color:rgba(255,255,255,.75);padding:10px 26px;display:flex;justify-content:space-between;font-size:11px;gap:10px}
.foot .tag{font-family:"Roboto Condensed",Arial,sans-serif;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#fff;background:rgba(255,255,255,.12);padding:2px 8px;border-radius:3px}

@media (max-width:640px){
  .filters{grid-template-columns:1fr 1fr}
  .meta,.sign{grid-template-columns:1fr}
  .th,.tr{grid-template-columns:1fr 34px 34px 34px 50px}
  .lh,.tb,.meta,.tw,.obs,.sign,.foot{padding-left:14px;padding-right:14px}
}
#printArea{display:none}
@media print{
  body{background:#fff}
  .top,.wrap,.overlay,.ovbar{display:none!important}
  #printArea{display:block!important}
  .sheet{box-shadow:none;border:none;border-radius:0;max-width:100%;margin:0;break-after:page;page-break-after:always;zoom:.88}
  .sheet:last-child{break-after:auto;page-break-after:auto}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  @page{size:A4;margin:10mm}
}
</style>
</head>
<body>

<div class="top"><div class="wrap">
  <h1><span class="mark"></span>Registro de inspecciones</h1>
  <span class="jll">JLL</span>
</div></div>

<div class="wrap" id="app"></div>
<div class="overlay" id="overlay" hidden>
  <div class="ovbar">
    <button class="btn" id="btnClose" type="button">← Volver</button>
    <button class="btn accent" id="btnPrintOne" type="button">Imprimir / Guardar PDF</button>
  </div>
  <div id="ovSheet"></div>
</div>
<div id="printArea"></div>

<script>
// ─── CONFIGURACIÓN ──────────────────────────────────────────────────────────
// Misma URL del Apps Script que usa el formulario.
const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwBCxBCRdRj9sPjr-eE0mOIQgbLbB6Zg16Xerto0xrWbWOtbIP66LDQRPeGIYGWdZEa/exec";
const SITIO_POR_DEFECTO = "Pacheco Trade Center"; // registros viejos que no tienen sitio

// Checklists: mismos textos que el formulario, para mostrar cada ítem con su nombre.
const CHECKLISTS = {
  AA: { titulo:"Aire acondicionado", lomo:"CLIMATIZACIÓN", items:[
    {key:"item1_termostatos",        desc:"Control de termostatos y enclavamientos",     freq:"Mensual"},
    {key:"item2_inspeccion_general", desc:"Inspección general del equipo",               freq:"Mensual"},
    {key:"item3_difusores",          desc:"Control / limpieza de difusores de aire",     freq:"Mensual"},
    {key:"item4_filtros",            desc:"Inspección / limpieza / cambio de filtros",   freq:"Mensual"},
    {key:"item5_rodamientos",        desc:"Verificar rodamientos / turbina / motor",     freq:"Trimestral"},
    {key:"item6_unidad_interior",    desc:"Limpieza de unidad interior",                 freq:"Mensual"},
    {key:"item7_gabinete_exterior",  desc:"Limpieza de gabinete exterior (hidrolavado)", freq:"Anual"}
  ]},
  DOCK: { titulo:"Dock de carga", lomo:"MUELLES", items:[
    {key:"item1_termostatos",        desc:"Estado general del dock",                      freq:"Mensual"},
    {key:"item2_inspeccion_general", desc:"Verificar funcionamiento de bomba hidráulica", freq:"Mensual"},
    {key:"item3_difusores",          desc:"Verificar vibración y pérdidas de aceite",     freq:"Mensual"},
    {key:"item4_filtros",            desc:"Control de lubricación de eje horizontal",     freq:"Mensual"},
    {key:"item5_rodamientos",        desc:"Estado gral: pintura, topes, etc.",            freq:"Mensual"}
  ]}
};

// ─── UTILIDADES ─────────────────────────────────────────────────────────────
const $ = id => document.getElementById(id);
const esc = s => String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const norm = h => String(h).normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().trim().replace(/[^a-z0-9]+/g,"_").replace(/^_|_$/g,"");
function store(k,v){ try{ v==null?localStorage.removeItem(k):localStorage.setItem(k,v);}catch(e){} }
function load(k){ try{ return localStorage.getItem(k);}catch(e){ return null;} }

function fmtFecha(v){
  if(!v) return "—";
  const d = new Date(v);
  if(isNaN(d)) return String(v);
  const p = n => String(n).padStart(2,"0");
  return `${p(d.getDate())}/${p(d.getMonth()+1)}/${d.getFullYear()} ${p(d.getHours())}:${p(d.getMinutes())}`;
}
function valClass(v){
  const x = norm(v);
  if(x==="si"||x==="ok"||x==="b"||x==="bueno") return "si";
  if(x==="no"||x==="m"||x==="malo") return "no";
  if(x==="no_aplica"||x==="na"||x==="n_a") return "na";
  if(x==="correctivo"||x==="r"||x==="regular") return "co";
  return "";
}

// Convierte una fila del Sheet en una inspección lista para dibujar.
function toInspeccion(raw, idx){
  const r = {}; Object.keys(raw).forEach(k => r[norm(k)] = raw[k]);
  const tipo = String(r.tipo_equipo || r.tipo || "").toUpperCase();
  const cl = CHECKLISTS[tipo];
  let items = [];
  if (r.checklist) { // formato futuro: [{desc,valor,freq}]
    try { items = (typeof r.checklist==="string"?JSON.parse(r.checklist):r.checklist).map(i=>({desc:i.desc,freq:i.freq||"",valor:i.valor})); } catch(e){}
  }
  if (!items.length && cl) items = cl.items.map(i => ({desc:i.desc, freq:i.freq, valor:r[i.key]})).filter(i => i.valor!==undefined);
  if (!items.length) items = Object.keys(r).filter(k=>/^item\d/.test(k)&&r[k]!=="").map(k=>({desc:k.replace(/^item\d+_/,"").replace(/_/g," "),freq:"",valor:r[k]}));
  const conProblemas = items.some(i => ["no","co"].includes(valClass(i.valor)));
  return {
    id: idx,
    titulo: r.title || r.titulo || (cl ? `${cl.titulo} N°${r.numero||""}` : "Inspección"),
    tipo, lomo: cl ? cl.lomo : (tipo || "EQUIPO"),
    sitio: r.sitio || SITIO_POR_DEFECTO,
    numero: r.numero, marca: r.marca, modelo: r.modelo, capacidad: r.capacidad,
    ubicacion: r.ubicacion, tecnico: r.tecnico, periodo: r.periodo || "",
    fecha: r.fecha_inspeccion || r.fecha || r.timestamp || r.marca_temporal,
    observaciones: r.observaciones, firma: r.firma_base64 || r.firma || r.firma_url || "",
    items, conProblemas
  };
}

// ─── DATOS ──────────────────────────────────────────────────────────────────
let TODAS = [];
async function cargar(clave){
  if (new URLSearchParams(location.search).has("demo")) return demo();
  const url = `${GOOGLE_SCRIPT_URL}?accion=listar&clave=${encodeURIComponent(clave)}`;
  const res = await fetch(url);
  const data = await res.json();
  if (!data.ok) { const e = new Error(data.error||"error"); e.code = data.error; throw e; }
  return data.rows;
}

// ─── PANTALLAS ──────────────────────────────────────────────────────────────
function pantallaClave(error){
  $("app").innerHTML = `
    <div class="gate">
      <h2 class="cond">Acceso al registro</h2>
      <p>Ingresá la clave para ver las planillas de inspección.</p>
      <input id="clave" type="password" placeholder="Clave" autocomplete="current-password">
      <button class="btn primary" id="btnEntrar" style="width:100%">Ver planillas</button>
      ${error?`<p style="color:var(--red);margin:10px 0 0">${esc(error)}</p>`:""}
    </div>`;
  const go = () => iniciar($("clave").value.trim());
  $("btnEntrar").onclick = go;
  $("clave").onkeydown = e => { if(e.key==="Enter") go(); };
  $("clave").focus();
}

async function iniciar(clave){
  $("app").innerHTML = `<div class="msg" style="margin-top:20px">Cargando inspecciones…</div>`;
  try {
    const rows = await cargar(clave);
    store("visor_clave", clave);
    TODAS = rows.map(toInspeccion).sort((a,b)=> new Date(b.fecha) - new Date(a.fecha));
    pantallaLista();
  } catch(e){
    if (e.code==="clave") { store("visor_clave", null); return pantallaClave("Clave incorrecta."); }
    $("app").innerHTML = `<div class="msg err" style="margin-top:20px">No se pudieron leer las inspecciones (${esc(e.message)}).<br>Revisá que el Apps Script tenga la función doGet publicada.</div>`;
  }
}

function opciones(lista, todas){
  return `<option value="">${todas}</option>` + [...new Set(lista.filter(Boolean))].map(v=>`<option>${esc(v)}</option>`).join("");
}

function pantallaLista(){
  $("app").innerHTML = `
    <div class="filters">
      <div><label for="fSitio">Sitio</label><select id="fSitio">${opciones(TODAS.map(i=>i.sitio),"Todos")}</select></div>
      <div><label for="fPeriodo">Período</label><select id="fPeriodo">${opciones(TODAS.map(i=>i.periodo),"Todos")}</select></div>
      <div><label for="fTipo">Equipo</label><select id="fTipo">${opciones(TODAS.map(i=>i.tipo),"Todos")}</select></div>
      <div><label for="fTexto">Buscar</label><input id="fTexto" type="text" placeholder="Ubicación, técnico, N°…"></div>
    </div>
    <div class="bar">
      <span class="count" id="count"></span>
      <button class="btn primary" id="btnPrintAll" type="button">Imprimir planillas filtradas</button>
    </div>
    <div class="list" id="list"></div>`;
  ["fSitio","fPeriodo","fTipo"].forEach(id => $(id).onchange = render);
  $("fTexto").oninput = render;
  $("btnPrintAll").onclick = () => imprimir(filtradas());
  render();
}

function filtradas(){
  const s=$("fSitio").value, p=$("fPeriodo").value, t=$("fTipo").value, q=norm($("fTexto").value);
  return TODAS.filter(i => (!s||i.sitio===s) && (!p||i.periodo===p) && (!t||i.tipo===t) &&
    (!q || norm([i.titulo,i.ubicacion,i.tecnico,i.numero,i.marca].join(" ")).includes(q)));
}

function render(){
  const lista = filtradas();
  $("count").textContent = `${lista.length} planilla${lista.length===1?"":"s"}`;
  $("btnPrintAll").disabled = !lista.length;
  $("list").innerHTML = lista.length ? lista.map(i => `
    <button class="item ${i.conProblemas?"warn":""}" data-id="${i.id}" type="button">
      <span class="t">${esc(i.titulo)}</span>
      <span class="st">${i.conProblemas?"Con observaciones":"Conforme"}</span>
      <span class="s">${esc(i.sitio)} · ${esc(i.periodo||"")} · ${fmtFecha(i.fecha)} · ${esc(i.tecnico||"—")}</span>
    </button>`).join("") : `<div class="empty">No hay planillas con esos filtros.</div>`;
  $("list").querySelectorAll(".item").forEach(b => b.onclick = () => abrir(TODAS.find(i=>i.id==b.dataset.id)));
}

// ─── PLANILLA ───────────────────────────────────────────────────────────────
function planillaHTML(i){
  const sq = (v,c) => `<div><span class="sq ${valClass(v)===c?"on "+c:""}"></span></div>`;
  const firma = /^(data:image|https?:)/.test(i.firma)
    ? `<img src="${esc(i.firma)}" alt="Firma de ${esc(i.tecnico)}">`
    : `<span class="typed">${esc(i.tecnico||"")}</span>`;
  const equipo = [i.marca,i.modelo].filter(Boolean).join(" · ");
  return `
  <div class="sheet">
    <div class="lh"><div class="brand"><span class="mark"></span>Schneider Electric</div><div class="jll">JLL</div></div>
    <div class="tb">
      <div class="eb">Planilla de inspección — mantenimiento preventivo</div>
      <h2>${esc(i.titulo)}</h2>
    </div>
    <div class="meta">
      <div class="r"><b>Sitio</b><span>${esc(i.sitio)}</span></div>
      <div class="r"><b>Inspección realizada por</b><span>${esc(i.tecnico||"—")}</span></div>
      <div class="r"><b>Equipo</b><span>${esc(equipo||"—")}</span></div>
      <div class="r"><b>Ubicación</b><span>${esc(i.ubicacion||"—")}</span></div>
      <div class="r"><b>Fecha</b><span>${fmtFecha(i.fecha)}</span></div>
      <div class="r"><b>Período</b><span>${esc(i.periodo||"—")}</span></div>
      ${i.capacidad && i.capacidad!=="N/A" ? `<div class="r"><b>Capacidad</b><span>${esc(i.capacidad)}</span></div>`:""}
      ${i.numero!==undefined && i.numero!=="" ? `<div class="r"><b>N° de equipo</b><span>${esc(i.numero)}</span></div>`:""}
    </div>
    <div class="tw">
      <div class="legend">
        <span><i style="background:var(--green)"></i>Sí — realizado / OK</span>
        <span><i style="background:var(--red)"></i>No</span>
        <span><i style="background:var(--grey)"></i>N/A — No aplica</span>
        <span><i style="background:var(--amber)"></i>Correctivo</span>
      </div>
      <div class="tflex">
        <div class="spine"><span>${esc(i.lomo)}</span></div>
        <div class="tcol">
          <div class="th"><div>Tareas</div><div>Sí</div><div>No</div><div>N/A</div><div>Correct.</div></div>
          ${i.items.map(t => `<div class="tr"><div>${esc(t.desc)}${t.freq?`<span class="fq">${esc(t.freq)}</span>`:""}</div>${sq(t.valor,"si")}${sq(t.valor,"no")}${sq(t.valor,"na")}${sq(t.valor,"co")}</div>`).join("")
            || `<div class="tr"><div>Sin ítems registrados</div><div></div><div></div><div></div><div></div></div>`}
        </div>
      </div>
    </div>
    <div class="obs"><h3>Observaciones generales</h3><div class="box">${esc(i.observaciones||"—")}</div></div>
    <div class="sign">
      <div class="f">
        <label>Firma digital — nombre y apellido</label><div class="v">${esc(i.tecnico||"—")}</div>
        <label style="margin-top:8px">Fecha de firma</label><div class="v">${fmtFecha(i.fecha)}</div>
        <div class="stamp"><span class="dot"></span>Firmado digitalmente por ${esc(i.tecnico||"—")}</div>
      </div>
      <div class="f"><label>Firma</label><div class="sigbox">${firma}</div></div>
    </div>
    <div class="foot"><span><i>Registro generado desde el formulario QR</i></span><span class="tag">Internal</span></div>
  </div>`;
}

let ACTUAL = null;
function abrir(i){ ACTUAL = i; $("ovSheet").innerHTML = planillaHTML(i); $("overlay").hidden = false; $("overlay").scrollTop = 0; }
$("btnClose").onclick = () => { $("overlay").hidden = true; };
$("btnPrintOne").onclick = () => imprimir([ACTUAL]);
function imprimir(lista){ $("printArea").innerHTML = lista.map(planillaHTML).join(""); setTimeout(()=>window.print(), 150); }
